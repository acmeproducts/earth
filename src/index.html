<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="geocoder-url" content="https://nominatim.openstreetmap.org/search">
  <title>Babylon.js Earth</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0a0a0f;
    }

    body.gameplay-input,
    body.gameplay-input * {
      cursor: none !important;
    }

    #renderCanvas {
      width: 100%;
      height: 100%;
      touch-action: none;
      display: block;
    }

    #attribution {
      position: fixed;
      right: 8px;
      bottom: 6px;
      z-index: 10;
      color: rgba(255, 255, 255, 0.78);
      font: 11px Arial, sans-serif;
      text-shadow: 0 1px 2px #000;
    }

    #attribution a { color: inherit; }

    #fpsCounter {
      position: fixed;
      top: 12px;
      right: 12px;
      z-index: 30;
      min-width: 154px;
      height: 28px;
      padding: 0 8px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 4px;
      background: rgba(10, 12, 15, 0.78);
      color: #f3f5f7;
      font: 600 12px/26px ui-monospace, SFMono-Regular, Consolas, monospace;
      font-variant-numeric: tabular-nums;
      text-align: center;
      pointer-events: none;
      white-space: pre;
    }

    #fpsCounter.expanded {
      box-sizing: border-box;
      min-width: 0;
      width: min(560px, calc(100vw - 24px));
      max-height: calc(100dvh - 24px);
      height: auto;
      overflow-y: auto;
      overscroll-behavior: contain;
      pointer-events: auto;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      padding: 7px 9px;
      line-height: 17px;
      text-align: left;
    }

    #interactionPrompt {
      position: fixed;
      left: 50%;
      top: calc(50% + 28px);
      transform: translateX(-50%);
      padding: 7px 12px;
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.72);
      color: white;
      font: 14px system-ui, sans-serif;
      pointer-events: none;
      z-index: 10;
    }
    #flySpeed {
      position: fixed;
      left: 12px;
      bottom: 28px;
      z-index: 30;
      min-width: 180px;
      height: 28px;
      padding: 0 8px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 4px;
      background: rgba(10, 12, 15, 0.78);
      color: #f3f5f7;
      font: 600 12px/26px ui-monospace, SFMono-Regular, Consolas, monospace;
      font-variant-numeric: tabular-nums;
      text-align: center;
      pointer-events: none;
    }

    .menu-key-hint {
      color: rgba(243, 245, 247, 0.68);
      font: 500 11px/1 ui-monospace, SFMono-Regular, Consolas, monospace;
      letter-spacing: 0.02em;
      white-space: nowrap;
    }

    .menu-key-hint kbd {
      display: inline-block;
      padding: 2px 5px 1px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-bottom-width: 2px;
      border-radius: 3px;
      font: inherit;
      color: rgba(243, 245, 247, 0.8);
    }

    #menuHint {
      position: fixed;
      left: 12px;
      bottom: 66px;
      z-index: 30;
      pointer-events: none;
      text-shadow: 0 1px 2px #000;
      transition: opacity 180ms ease;
    }

    #menuHint.hidden { opacity: 0; }

    #sceneControls {
      position: fixed;
      inset: 0 auto 0 0;
      z-index: 40;
      width: min(390px, 100vw);
      padding: 22px 20px;
      overflow-y: auto;
      border-right: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(12, 15, 18, 0.96);
      box-shadow: 12px 0 30px rgba(0, 0, 0, 0.28);
      color: #f3f5f7;
      font: 13px Arial, sans-serif;
      transform: translateX(-100%);
      visibility: hidden;
      pointer-events: none;
      transition: transform 180ms ease, visibility 0s linear 180ms;
    }

    #sceneControls.open {
      transform: translateX(0);
      visibility: visible;
      pointer-events: auto;
      transition-delay: 0s;
    }

    #sceneControls:focus { outline: none; }
    #sceneControls h1 {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin: 0 0 24px;
      color: #fff;
      font-size: 20px;
      font-weight: 650;
    }

    .scene-control-group + .scene-control-group {
      margin-top: 26px;
      padding-top: 22px;
      border-top: 1px solid rgba(255, 255, 255, 0.14);
    }

    .scene-control-group h2 {
      margin: 0 0 15px;
      color: #aeb8bf;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    .scene-control-row {
      display: grid;
      grid-template-columns: 96px minmax(92px, 1fr) 54px auto;
      align-items: center;
      gap: 8px;
      color: #d9dfe3;
    }

    .scene-control-row + .scene-control-row { margin-top: 12px; }
    .scene-control-row input { width: 100%; accent-color: #589a72; }
    .clock-mode-row input {
      grid-column: 2;
      justify-self: start;
      width: auto;
    }
    .visibility-control-row input {
      grid-column: 2;
      justify-self: start;
      width: auto;
    }
    .antialiasing-control-row { grid-template-columns: 1fr; }
    .antialiasing-description { color: #a8b8ae; font-size: 12px; line-height: 1.4; margin: 8px 0 0; }
    .date-control-row input, .antialiasing-control-row select {
      grid-column: 2 / 4;
      min-width: 0;
      box-sizing: border-box;
      padding: 3px 5px;
      border: 1px solid #505961;
      border-radius: 4px;
      background: #171c20;
      color: #fff;
      color-scheme: dark;
      font: inherit;
    }
    .antialiasing-control-row select { grid-column: 1; width: 100%; padding: 7px; }
    .scene-control-row output {
      color: #fff;
      font-variant-numeric: tabular-nums;
      text-align: right;
    }

    .scene-control-row button {
      padding: 4px 7px;
      border: 1px solid #505961;
      border-radius: 4px;
      background: #20262b;
      color: #bfc8ce;
      font: inherit;
      cursor: pointer;
    }

    .scene-control-row button.active { background: #397354; color: #fff; }
    .scene-control-row button:focus-visible { outline: 2px solid #8fc4a4; outline-offset: 2px; }

    .coordinate-form {
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      align-items: end;
      gap: 10px;
    }

    .place-form {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: end;
      gap: 10px;
      margin-bottom: 14px;
    }

    .google-maps-link {
      grid-column: 1 / -1;
      justify-self: start;
      color: #8fc4a4;
      font-size: 12px;
      text-underline-offset: 3px;
    }

    .google-maps-link:hover { color: #fff; }
    .google-maps-link[aria-disabled="true"] { opacity: 0.5; }
    .google-maps-link:focus-visible { outline: 2px solid #8fc4a4; outline-offset: 2px; }

    .coordinate-field,
    .place-field {
      display: grid;
      gap: 6px;
      color: #cbd3d8;
      font-size: 12px;
    }

    .coordinate-field input,
    .place-field input {
      min-width: 0;
      width: 100%;
      height: 34px;
      padding: 0 8px;
      border: 1px solid #4b555d;
      border-radius: 4px;
      background: #11161a;
      color: #fff;
      font: 13px ui-monospace, SFMono-Regular, Consolas, monospace;
      font-variant-numeric: tabular-nums;
    }

    .place-field input { font-family: Arial, sans-serif; }

    .coordinate-go,
    .random-location,
    .place-go {
      height: 34px;
      padding: 0 14px;
      border: 1px solid #4e8f69;
      border-radius: 4px;
      background: #397354;
      color: #fff;
      font: 600 13px Arial, sans-serif;
      cursor: pointer;
    }

    .random-location { margin-top: 14px; }

    .coordinate-go:disabled,
    .random-location:disabled,
    .place-go:disabled { opacity: 0.5; cursor: wait; }
    .coordinate-field input:focus-visible,
    .place-field input:focus-visible,
    .coordinate-go:focus-visible,
    .random-location:focus-visible,
    .place-go:focus-visible { outline: 2px solid #8fc4a4; outline-offset: 2px; }
    .coordinate-status {
      display: block;
      min-height: 16px;
      margin-top: 10px;
      color: #b8c3c9;
      font-size: 12px;
    }

    @media (max-width: 420px) {
      .coordinate-form { grid-template-columns: 1fr 1fr; }
      .coordinate-go { grid-column: 1 / -1; }
    }

    #loading {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 28px 24px;
      overflow: auto;
      color: #e4eadc;
      background: radial-gradient(ellipse at 50% 38%, #26382b 0%, #101c18 48%, #090f0e 100%);
      z-index: 100;
      transition: opacity 0.5s ease-out;
      font-family: system-ui, sans-serif;
    }

    #loading.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .loader-gallery { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: min(460px, 85vw, 65vh); aspect-ratio: 1; }
    .loader-gallery::before {
      content: ''; position: absolute; inset: 12% 8% 20%; border: 1px solid #acc4971f; border-radius: 50%;
      background: repeating-linear-gradient(0deg, transparent 0 31px, #acc49709 31px 32px), repeating-linear-gradient(90deg, transparent 0 31px, #acc49709 31px 32px);
    }
    .loader-actor { position: relative; display: block; width: 100%; height: 100%; pointer-events: none; }
    .loader-actor-caption { position: absolute; top: 100%; width: 100%; color: #bac7b4; text-align: center; font: 17px Georgia, serif; }
    .loader-status { position: absolute; top: calc(50% + min(230px, 42.5vw, 32.5vh) + 48px); width: min(360px, calc(100% - 48px)); padding-bottom: 24px; }
    .loader-status-row { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; }
    .loader-percent { color: #c8d6b5; font: 12px 'Courier New', monospace; font-variant-numeric: tabular-nums; }
    .loader-retry { display: none; margin: 18px auto 0; padding: 9px 18px; border: 1px solid #9aaa95; border-radius: 4px; color: #e4eadc; background: #26382b; cursor: pointer; font: inherit; }
    .loader-retry:focus-visible { outline: 2px solid #c8d6b5; outline-offset: 4px; }

    .loader-text {
      color: #bac7b4;
      font-size: 12px;
      min-height: 17px;
    }

    .loader-progress {
      width: 100%;
      height: 3px;
      margin-top: 13px;
      overflow: hidden;
      border-radius: 999px;
      background: #ffffff12;
    }

    .loader-progress-bar {
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #739b68, #d2dfac);
      box-shadow: 0 0 12px #b5ce8050;
      transition: width 0.3s ease-out;
    }

    #loading.error .loader-retry { display: block; }

    #loading.error .loader-text {
      color: #f87171;
    }

    #loading.error .loader-progress-bar {
      background: #ef4444;
    }

    @media (prefers-reduced-motion: reduce) {
      #loading, .loader-progress-bar { transition: none; }
    }
    @media (max-height: 560px) {
      .loader-gallery { width: min(240px, 50vh, 80vw); }
      .loader-status { top: calc(75% + 34px); }
    }

    #impostorControls {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 20;
      width: 280px;
      padding: 16px;
      border: 1px solid #3d4650;
      border-radius: 6px;
      background: rgba(19, 23, 27, 0.94);
      color: #f3f5f7;
      font: 13px Arial, sans-serif;
    }

    #impostorControls h1 { margin-bottom: 14px; font-size: 17px; }
    #impostorControls label { display: grid; grid-template-columns: 1fr 72px; align-items: center; gap: 10px; margin: 9px 0; }
    #impostorControls input { width: 100%; padding: 5px 6px; border: 1px solid #56616b; border-radius: 3px; background: #0e1114; color: #fff; }
    .impostor-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 14px 0; }
    .impostor-actions button { padding: 8px; border: 1px solid #697681; border-radius: 4px; background: #2d6a4f; color: #fff; cursor: pointer; }
    .impostor-actions button:last-child { background: #35424c; }
    .impostor-actions button:disabled { opacity: 0.45; cursor: default; }
    #capturePreview { display: block; width: 100%; height: auto; border: 1px solid #364049; background: #000; image-rendering: auto; }
    #captureStatus { display: block; min-height: 30px; margin-top: 10px; color: #b9c4cc; line-height: 1.35; }
    .impostor-mode #loading { background: #101419; }
    .impostor-mode .loader-text { color: #8fc4a4; letter-spacing: 0; }
    #impostorValidation { position: fixed; inset: 0; z-index: 20; overflow: auto; padding: 20px; background: #101419; color: #e7edf2; font: 14px/1.4 system-ui, sans-serif; }
    #impostorValidation h1 { margin: 0 0 8px; font-size: 22px; }
    #impostorValidation [data-result="pass"] { color: #77d69b; }
    #impostorValidation [data-result="fail"] { color: #ff8b85; }
    #validationGrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; }
    #validationGrid article { padding: 10px; border: 1px solid #34404a; border-radius: 4px; background: #171d22; }
    #validationGrid h2, #validationGrid p { margin: 0 0 6px; font-size: 13px; }
    #validationGrid article > div { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    #validationGrid figure { margin: 0; }
    #validationGrid figcaption { margin-bottom: 3px; color: #9eabb5; }
    #validationGrid canvas { display: block; width: 100%; height: auto; background: #090b0d; image-rendering: pixelated; }
    #validationReport { white-space: pre-wrap; color: #aeb9c2; }
  </style>
</head>
<body>
  <div id="loading">
    <figure class="loader-gallery">
      <canvas class="loader-actor" width="460" height="460" role="img" aria-label="Preview of assets generated for this world"></canvas>
      <figcaption class="loader-actor-caption"></figcaption>
    </figure>
    <div class="loader-status">
      <div class="loader-status-row">
        <div class="loader-text" aria-live="polite">Preparing the scene</div>
        <span class="loader-percent" aria-hidden="true">0%</span>
      </div>
      <div
        class="loader-progress"
        role="progressbar"
        aria-label="World initialization progress"
        aria-valuemin="0"
        aria-valuemax="100"
        aria-valuenow="0"
      >
        <div class="loader-progress-bar"></div>
      </div>
      <button class="loader-retry" type="button">Try again</button>
    </div>
  </div>
  <canvas id="renderCanvas"></canvas>
  <div id="attribution">
    &copy; ESA WorldCover 2021 &middot;
    <a href="https://openfreemap.org" target="_blank" rel="noopener">OpenFreeMap</a> &middot;
    &copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap contributors</a>
  </div>
</body>
</html>
