<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Babylon.js Earth</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0a0a0f;
    }

    #renderCanvas {
      width: 100%;
      height: 100%;
      touch-action: none;
      display: block;
    }

    #attribution {
      position: fixed;
      right: 8px;
      bottom: 6px;
      z-index: 10;
      color: rgba(255, 255, 255, 0.78);
      font: 11px Arial, sans-serif;
      text-shadow: 0 1px 2px #000;
    }

    #attribution a { color: inherit; }

    #fpsCounter {
      position: fixed;
      top: 12px;
      right: 12px;
      z-index: 30;
      min-width: 154px;
      height: 28px;
      padding: 0 8px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 4px;
      background: rgba(10, 12, 15, 0.78);
      color: #f3f5f7;
      font: 600 12px/26px ui-monospace, SFMono-Regular, Consolas, monospace;
      font-variant-numeric: tabular-nums;
      text-align: center;
      pointer-events: none;
    }

    #flySpeed {
      position: fixed;
      left: 12px;
      bottom: 28px;
      z-index: 30;
      min-width: 94px;
      height: 28px;
      padding: 0 8px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 4px;
      background: rgba(10, 12, 15, 0.78);
      color: #f3f5f7;
      font: 600 12px/26px ui-monospace, SFMono-Regular, Consolas, monospace;
      font-variant-numeric: tabular-nums;
      text-align: center;
      pointer-events: none;
    }

    #vegetationControls {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 30;
      width: 320px;
      padding: 12px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 6px;
      background: rgba(10, 12, 15, 0.88);
      color: #f3f5f7;
      font: 12px Arial, sans-serif;
    }

    #vegetationControls h2 {
      margin: 0 0 10px;
      font-size: 13px;
      font-weight: 600;
    }

    .vegetation-control-row {
      display: grid;
      grid-template-columns: 64px 1fr;
      align-items: center;
      gap: 8px;
      margin-top: 7px;
    }

    .vegetation-segmented {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      height: 28px;
      border: 1px solid #505961;
      border-radius: 4px;
      overflow: hidden;
    }

    .vegetation-segmented button {
      min-width: 0;
      border: 0;
      border-left: 1px solid #505961;
      background: #20262b;
      color: #bfc8ce;
      font: inherit;
      cursor: pointer;
    }

    .vegetation-segmented button:first-child { border-left: 0; }
    .vegetation-segmented button.active { background: #397354; color: #fff; }
    .vegetation-segmented button:focus-visible { outline: 2px solid #8fc4a4; outline-offset: -2px; }

    .vegetation-distance-row {
      display: grid;
      grid-template-columns: 78px 1fr 42px;
      align-items: center;
      gap: 8px;
      margin-top: 12px;
      color: #d9dfe3;
    }

    .vegetation-distance-row input { width: 100%; accent-color: #589a72; }
    .vegetation-distance-row output {
      color: #fff;
      font-variant-numeric: tabular-nums;
      text-align: right;
    }

    @media (max-width: 520px) {
      #vegetationControls {
        top: 52px;
        width: calc(100% - 24px);
      }
    }

    #loading {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #0a0a0f 0%, #1a1a2e 50%, #0a0a0f 100%);
      z-index: 100;
      transition: opacity 0.5s ease-out;
      font-family: 'Courier New', monospace;
    }

    #loading.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .loader {
      width: 60px;
      height: 60px;
      border: 3px solid #2a2a4a;
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    .loader-text {
      margin-top: 20px;
      color: #6366f1;
      font-size: 14px;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    #impostorControls {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 20;
      width: 280px;
      padding: 16px;
      border: 1px solid #3d4650;
      border-radius: 6px;
      background: rgba(19, 23, 27, 0.94);
      color: #f3f5f7;
      font: 13px Arial, sans-serif;
    }

    #impostorControls h1 { margin-bottom: 14px; font-size: 17px; }
    #impostorControls label { display: grid; grid-template-columns: 1fr 72px; align-items: center; gap: 10px; margin: 9px 0; }
    #impostorControls input { width: 100%; padding: 5px 6px; border: 1px solid #56616b; border-radius: 3px; background: #0e1114; color: #fff; }
    .impostor-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 14px 0; }
    .impostor-actions button { padding: 8px; border: 1px solid #697681; border-radius: 4px; background: #2d6a4f; color: #fff; cursor: pointer; }
    .impostor-actions button:last-child { background: #35424c; }
    .impostor-actions button:disabled { opacity: 0.45; cursor: default; }
    #capturePreview { display: block; width: 100%; height: auto; border: 1px solid #364049; background: #000; image-rendering: auto; }
    #captureStatus { display: block; min-height: 30px; margin-top: 10px; color: #b9c4cc; line-height: 1.35; }
    .impostor-mode #loading { background: #101419; }
    .impostor-mode .loader { border-color: #34404a; border-top-color: #62a67e; }
    .impostor-mode .loader-text { color: #8fc4a4; letter-spacing: 0; }
    #impostorValidation { position: fixed; inset: 0; z-index: 20; overflow: auto; padding: 20px; background: #101419; color: #e7edf2; font: 14px/1.4 system-ui, sans-serif; }
    #impostorValidation h1 { margin: 0 0 8px; font-size: 22px; }
    #impostorValidation [data-result="pass"] { color: #77d69b; }
    #impostorValidation [data-result="fail"] { color: #ff8b85; }
    #validationGrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; }
    #validationGrid article { padding: 10px; border: 1px solid #34404a; border-radius: 4px; background: #171d22; }
    #validationGrid h2, #validationGrid p { margin: 0 0 6px; font-size: 13px; }
    #validationGrid article > div { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    #validationGrid figure { margin: 0; }
    #validationGrid figcaption { margin-bottom: 3px; color: #9eabb5; }
    #validationGrid canvas { display: block; width: 100%; height: auto; background: #090b0d; image-rendering: pixelated; }
    #validationReport { white-space: pre-wrap; color: #aeb9c2; }
  </style>
</head>
<body>
  <div id="loading">
    <div class="loader"></div>
    <div class="loader-text">Initializing</div>
  </div>
  <canvas id="renderCanvas"></canvas>
  <div id="attribution">
    &copy; ESA WorldCover 2020 &middot;
    <a href="https://openfreemap.org" target="_blank" rel="noopener">OpenFreeMap</a> &middot;
    &copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap contributors</a>
  </div>
</body>
</html>
