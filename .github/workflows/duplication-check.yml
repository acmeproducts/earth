name: Duplicate Code Check

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: duplication-${{ github.ref }}
  cancel-in-progress: true

jobs:
  duplication-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Download baseline from target branch
        if: github.event_name == 'pull_request'
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: duplication-check.yml
          branch: ${{ github.base_ref }}
          event: push
          name: duplication-baseline
          path: .
          if_no_artifact_found: warn

      - name: Rename baseline for comparison
        if: github.event_name == 'pull_request'
        run: |
          if [ -f duplicated_segments.json ]; then mv duplicated_segments.json previous_segments.json; fi
          if [ -f duplication_severity.txt ]; then mv duplication_severity.txt previous_severity.txt; fi

      - name: Run duplicate code checker
        run: node scripts/check-duplication.mjs

      - name: Upload baseline artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: duplication-baseline
          path: |
            duplicated_segments.json
            duplication_severity.txt
          retention-days: 90
          overwrite: true

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: duplication-report.html
          path: duplication_report.html
          retention-days: 30
          overwrite: true
